<text x="720" y="741" class="label" text-anchor="middle">Upper Min River valley · a schematic field scene</text>
<g class="icon" transform="translate(53 258)"><circle cx="20" cy="19" r="13"/><path d="M16 5a15 15 0 1 0 16 20" stroke="#b56c43" stroke-width="3"/><path d="M28 8 39 0l3 4-11 8-5 1z" fill="#a78d67"/></g>
<text x="107" y="277" class="kicker" >01</text>
<text x="53" y="315" class="head" >The line around a circle</text>
<text x="53" y="345" class="body" >Draw a circle. Its rim tells you where</text>
<text x="53" y="369" class="body" >it ends. To study a people, Wang asks</text>
<text x="53" y="393" class="body" >where people themselves draw the line.</text>
<path d="M53 411h352" stroke="#bba98c" opacity=".7"/>
<g class="icon" transform="translate(53 417)"><path d="m2 30 12-23 9 4-10 23z" fill="#b0bdad"/><path d="m18 32 15-19 6 4-9 19z" fill="#d1ac77"/><circle cx="32" cy="20" r="1"/><circle cx="29" cy="24" r="1"/><path d="m5 28 9-15m6 17 8-9"/></g>
<text x="107" y="436" class="kicker" >02</text>
<text x="53" y="474" class="head" >The limits of likeness</text>
<text x="53" y="504" class="body" >Neighbours may speak alike and use</text>
<text x="53" y="528" class="body" >the same tools, yet call themselves by</text>
<text x="53" y="552" class="body" >different names. Who counts as kin?</text>
<path d="M53 570h352" stroke="#bba98c" opacity=".7"/>
<g class="icon" transform="translate(53 576)"><path d="M1 32Q16 19 39 20M0 27Q14 13 39 15M1 22Q15 8 39 10"/><path d="M22 13V1m0 8-5-4m5 1 5-5" stroke="#a75f37" stroke-width="2"/></g>
<text x="107" y="595" class="kicker" >03</text>
<text x="53" y="633" class="head" >Fields, pasture and water</text>
<text x="53" y="663" class="body" >Sharing a spring can draw households</text>
<text x="53" y="687" class="body" >together. A claim to pasture can set</text>
<text x="53" y="711" class="body" >those same neighbours apart.</text>
<path d="M53 729h352" stroke="#bba98c" opacity=".7"/>
<g class="icon" transform="translate(1031 258)"><path d="M20 3v13M7 23v-7h26v7"/><circle cx="20" cy="3" r="3.6" fill="#ad6b44"/><circle cx="7" cy="26" r="4"/><circle cx="20" cy="26" r="4"/><circle cx="33" cy="26" r="4"/></g>
<text x="1085" y="277" class="kicker" >04</text>
<text x="1031" y="315" class="head" >Heroes and brothers</text>
<text x="1031" y="345" class="body" >A hero can stand at the head of a line</text>
<text x="1031" y="369" class="body" >of descent. Brothers give neighbouring</text>
<text x="1031" y="393" class="body" >villages a way to speak of kinship.</text>
<path d="M1031 411h352" stroke="#bba98c" opacity=".7"/>
<g class="icon" transform="translate(1031 417)"><path d="M2 27q15-16 36-9M3 32q14-17 37-9"/><path d="m4 10 6-6 8 6zm19 2 6-6 8 6z" fill="#ba8961"/><path d="M7 11v5h8v-5m11 2v5h8v-5"/></g>
<text x="1085" y="436" class="kicker" >05</text>
<text x="1031" y="474" class="head" >A name changes hands</text>
<text x="1031" y="504" class="body" >Walk upstream. The village that one</text>
<text x="1031" y="528" class="body" >settlement calls an outsider may call</text>
<text x="1031" y="552" class="body" >the next village an outsider in turn.</text>
<path d="M1031 570h352" stroke="#bba98c" opacity=".7"/>
<g class="icon" transform="translate(1031 576)"><path d="M2 4q10-2 18 2v25q-8-4-18-2zm18 2q10-4 19-3v25q-10 0-19 3z" fill="#e9d5b4"/><path d="m6 10 9 1m-9 5 8 1m11-5 9-2m-9 8 7-2" stroke="#ac805c"/></g>
<text x="1085" y="595" class="kicker" >06</text>
<text x="1031" y="633" class="head" >What falls from memory</text>
<text x="1031" y="663" class="body" >Some forebears recur in every telling.</text>
<text x="1031" y="687" class="body" >Others fade as ties change. Wang calls</text>
<text x="1031" y="711" class="body" >this pattern structural amnesia.</text>
<path d="M1031 729h352" stroke="#bba98c" opacity=".7"/>
<rect x="45" y="778" width="1350" height="106" fill="#254e4e" rx="3"/>
<text x="68" y="805" class="eyebrow" style="fill:#e4bf86">FROM THE FIELD   /   BROTHER ANCESTORS</text>
<text x="68" y="843" class="" font-size="31" style="fill:#fffae9">Three villages, three brothers.</text>
<text x="579" y="817" class="" font-size="20" style="fill:#fff8e9">In one valley account, three brothers founded three villages. A story told across four valleys</text>
<text x="579" y="846" class="" font-size="20" style="fill:#fff8e9">could begin with four brothers. The remembered family grew with the circle of neighbours.</text>
<text x="46" y="938" class="small" >Source: Wang Ming-ke, Huaxia Frontier, 2020 Chinese edition, prefatory essay, pp. 10–11, and Part I.</text>
<text x="1395" y="938" class="kicker" text-anchor="end">ILLUSTRATED READING GUIDE     /     01</text>
