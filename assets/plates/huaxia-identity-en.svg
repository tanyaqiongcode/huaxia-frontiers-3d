<text x="45" y="62" class="eyebrow" >FIELD READER   /   HISTORICAL ANTHROPOLOGY</text>
<text x="1395" y="62" class="eyebrow" text-anchor="end">WANG MING-KE     ·     HUAXIA FRONTIER</text>
<text x="720" y="133" class="" text-anchor="middle" font-size="65">Reading identity from the margins</text>
<text x="720" y="170" class="" text-anchor="middle" font-size="23" font-style="italic">Along the upper Min River, who counted as “one of us” depended on which village you asked.</text>
<path d="M45 194h1350" class="fine"/>
<text x="53" y="225" class="eyebrow" >I.   DRAWING A BOUNDARY</text>
<text x="720" y="225" class="eyebrow" text-anchor="middle">A VALLEY IN THREE VOICES</text>
<text x="1031" y="225" class="eyebrow" >II.   REMEMBERING A PAST</text>
