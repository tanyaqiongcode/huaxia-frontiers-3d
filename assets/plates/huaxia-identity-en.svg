<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" role="img" aria-labelledby="title desc">
<title id="title">Huaxia Frontier — Reading identity from the margins</title>
<desc id="desc">An illustrated reading guide to Wang Ming-ke’s Huaxia Frontier. Six short panels surround an imagined river valley with villages, terraced fields and mountains. Along the upper Min River, stories of brother ancestors linked villages that cooperated and competed for local resources.</desc>
